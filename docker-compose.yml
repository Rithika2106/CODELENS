version: '3.8'

services:
  # Local Ollama LLM Service (100% Local Runtime)
  ollama:
    image: ollama/ollama:latest
    container_name: codelens-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Fallback to CPU if GPU driver is not present

  # CodeLens Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codelens-backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    ports:
      - "5000:5000"
    depends_on:
      - ollama
    restart: unless-stopped

  # CodeLens Frontend Web Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codelens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
    name: codelens_ollama_models
